name: Publisher Gate Tests

on:
  pull_request:
    paths:
      - "publisher/**"
      - ".github/workflows/publisher-gate-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run publisher gate tests
        working-directory: publisher
        run: python -m unittest -v test_gate.py
